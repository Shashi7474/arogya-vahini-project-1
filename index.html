<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amazon Clone</title>

<style>

body{
font-family: Arial;
margin:0;
background:#e3e6e6;
}

.navbar{
background:#131921;
color:white;
display:flex;
align-items:center;
padding:10px;
}

.logo{
font-size:24px;
font-weight:bold;
margin-right:20px;
}

.search{
flex:1;
display:flex;
}

.search input{
width:100%;
padding:8px;
border:none;
}

.search button{
background:orange;
border:none;
padding:8px 15px;
cursor:pointer;
}

.menu{
margin-left:20px;
cursor:pointer;
}

.banner img{
width:100%;
height:350px;
object-fit:cover;
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
padding:20px;
}

.box{
background:white;
padding:15px;
}

.box img{
width:100%;
height:200px;
object-fit:cover;
}

.price{
color:green;
font-weight:bold;
}

button{
background:#ffd814;
border:none;
padding:8px;
margin-top:10px;
cursor:pointer;
}

.footer{
background:#131921;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}

</style>
</head>

<body>

<div class="navbar">

<div class="logo">amazon</div>

<div class="search">
<input type="text" id="searchInput" placeholder="Search Amazon">
<button onclick="searchProduct()">Search</button>
</div>

<div class="menu">Account</div>
<div class="menu">Orders</div>
<div class="menu" onclick="cart()">Cart</div>

</div>

<div class="banner">
<img src="https://images.unsplash.com/photo-1607082349566-187342175e2f">
</div>

<div class="products">

<div class="box">
<h3>Laptop</h3>
<img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
<p class="price">$799</p>
<button onclick="addCart()">Add to Cart</button>
</div>

<div class="box">
<h3>Headphones</h3>
<img src="https://images.unsplash.com/photo-1518449036407-6a1e1a8d4a06">
<p class="price">$99</p>
<button onclick="addCart()">Add to Cart</button>
</div>

<div class="box">
<h3>Smart Watch</h3>
<img src="https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b">
<p class="price">$149</p>
<button onclick="addCart()">Add to Cart</button>
</div>

<div class="box">
<h3>Mobile Phone</h3>
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
<p class="price">$499</p>
<button onclick="addCart()">Add to Cart</button>
</div>

</div>

<div class="footer">
© Amazon Clone Project
</div>

<script>

function searchProduct(){
let s=document.getElementById("searchInput").value;
alert("Searching for: "+s);
}

function addCart(){
alert("Product added to cart");
}

function cart(){
alert("Opening cart");
}

</script>

</body>
</html>
