<!DOCTYPE html>
<html>
<head>
<title>Amazon Clone</title>

<style>

body{
margin:0;
font-family:Arial;
background:#e3e6e6;
}

/* NAVBAR */

.navbar{
background:#131921;
color:white;
display:flex;
align-items:center;
padding:10px;
}

.logo{
font-size:24px;
font-weight:bold;
margin-right:20px;
}

.search{
flex:1;
display:flex;
}

.search input{
width:100%;
padding:8px;
border:none;
}

.search button{
background:#febd69;
border:none;
padding:8px 15px;
cursor:pointer;
}

.menu{
margin-left:20px;
cursor:pointer;
}

/* CATEGORY */

.category{
background:#232f3e;
color:white;
padding:10px;
display:flex;
gap:20px;
}

/* BANNER */

.banner img{
width:100%;
height:500px;
object-fit:cover;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:5px;
text-align:center;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.price{
color:green;
font-weight:bold;
}

button{
background:#ffd814;
border:none;
padding:8px;
margin-top:10px;
cursor:pointer;
}

/* FOOTER */

.footer{
background:#131921;
color:white;
text-align:center;
padding:20px;
}

</style>

</head>

<body>

<div class="navbar">

<div class="logo">amazon</div>

<div class="search">
<input type="text" placeholder="Search Amazon">
<button>Search</button>
</div>

<div class="menu">Account</div>
<div class="menu">Orders</div>
<div class="menu">Cart</div>

</div>

<div class="category">

<div>Electronics</div>
<div>Mobiles</div>
<div>Fashion</div>
<div>Home</div>
<div>Books</div>
<div>Appliances</div>

</div>

<!-- WORKING BANNER -->

<div class="banner">
<img src="https://graphicsfamily.com/wp-content/uploads/edd/2022/06/Free-E-commerce-Product-Banner-Design-with-Green-Colors-2048x1152.jpg">
</div>

<div class="products">

<div class="card">
<h3>Laptop</h3>
<img src="https://img.freepik.com/free-photo/view-3d-laptop-device-with-screen-keyboard_23-2150714071.jpg?w=360">
<p class="price">$799</p>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>Headphones</h3>
<img src="https://cdn.shopify.com/s/files/1/0057/8938/4802/files/Rockerz_650_pp_renders_main_banner.124.png?v=1740735495&width=400">
<p class="price">$99</p>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>Smart Watch</h3>
<img src="https://temptindia.com/cdn/shop/files/Artboard1.png?v=1704273967">
<p class="price">$149</p>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>Mobile Phone</h3>
<img src="https://93mobiles.com/wp-content/uploads/2025/10/71rwU33iPuL._SL1500_-2.jpg">
<p class="price">$499</p>
<button>Add to Cart</button>
</div>

</div>

<div class="footer">
Amazon Clone Project © 2026
</div>

</body>
</html>
